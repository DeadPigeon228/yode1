<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МЫ ХОТИМ ПОСМОТРЕТЬ ИТД</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://sun9-42.userapi.com/s/v1/ig2/KDyKALSNSdM5p9tSYaRIze6qvUuDTUZwoKQusS8rSJe4QzQYssY9cnHg60aeaASmjODh2ZcOyNccLUz4cWEB827n.jpg?quality=95&as=32x40,48x60,72x90,108x136,160x201,240x302,358x450&from=bu&u=0vH6ktIUPCGwqZ2ialQHTnMa8UnzmgA0caAmUXU9-QU&cs=358x0') repeat;
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(120, 80, 255, 0.5);
    }

    .add-form {
      background: #c4b06a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid #a8944f;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .form-row input {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #a8944f;
      background: #d5c78e;
      color: #3d3520;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-row input:focus {
      border-color: #8a7a3a;
      background: #e0d39f;
      box-shadow: 0 0 0 3px rgba(138, 122, 58, 0.2);
    }

    .form-row input::placeholder {
      color: #8a7a4a;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-add {
      background: #6a9e6a;
      color: #e0f0e0;
      width: 100%;
    }

    .btn-add:hover {
      background: #558855;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(106, 158, 106, 0.4);
    }

    .btn-small {
      padding: 4px 10px;
      font-size: 13px;
      border-radius: 6px;
      min-width: 28px;
    }

    .btn-plus {
      background: #6a9e6a;
      color: #e0f0e0;
    }
    .btn-plus:hover {
      background: #558855;
    }

    .btn-minus {
      background: #c47070;
      color: #f0e0e0;
    }
    .btn-minus:hover {
      background: #a85555;
    }

    .btn-delete {
      background: transparent;
      color: #c07070;
      border: 1px solid #c07070;
    }
    .btn-delete:hover {
      background: #c07070;
      color: white;
    }

    .btn-delete-selected {
      background: #7a3030;
      color: #f0d0d0;
      margin-left: auto;
    }
    .btn-delete-selected:hover {
      background: #5a2020;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #4a7a4a;
      color: #c0e0c0;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #b8e6b8;
      border-color: #b8e6b8;
      color: #2d5a2d;
    }

    .item {
      background: rgba(20, 20, 40, 0.75);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s;
      backdrop-filter: blur(6px);
    }

    .item.selected {
      border-color: #ff5252;
      background: rgba(255, 82, 82, 0.2);
    }

    .item.watched {
      background: rgba(30, 50, 30, 0.8);
      border-color: rgba(168, 216, 168, 0.3);
    }

    .item.dropped {
      opacity: 0.5;
    }

    .item:hover {
      background: rgba(30, 30, 55, 0.8);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .item-checkbox {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #6a9e6a;
      transform: scale(1.2);
    }

    .item-select {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #c07070;
    }

    .item-title {
      font-weight: 700;
      font-size: 16px;
      min-width: 140px;
      flex: 1;
      color: #d8d8e8;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .item-rating {
      color: #e0c070;
      font-weight: bold;
      font-size: 14px;
    }

    .item-season-episode {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 10, 25, 0.7);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .item-season-episode span {
      font-weight: bold;
      color: #b0b0c0;
      min-width: 18px;
      text-align: center;
    }

    .item-notes {
      font-size: 12px;
      color: #888;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stats {
      text-align: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }

    .select-all-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: #999;
    }

    .select-all-row input {
      accent-color: #c07070;
    }

    @media (max-width: 600px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
      }
      .form-row input {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 МЫ ХОТИМ ПОСМОТРЕТЬ ИТД</h1>

    <div class="add-form">
      <div class="form-row">
        <input type="text" id="inputTitle" placeholder="Название фильма или сериала">
        <input type="number" id="inputRating" placeholder="НУ ТИП ОЦЕНКА" min="0" max="10">
      </div>
      <div class="form-row">
        <input type="number" id="inputSeason" placeholder="Сезон" min="1">
        <input type="number" id="inputEpisode" placeholder="Серия" min="1">
        <input type="text" id="inputNotes" placeholder="заметочки">
      </div>
      <button class="btn btn-add" onclick="addItem()">➕ Добавить</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all')">Все</button>
        <button class="filter-btn" onclick="setFilter('watching')">📺 Смотрим</button>
        <button class="filter-btn" onclick="setFilter('planned')">📋 Запланировано</button>
        <button class="filter-btn" onclick="setFilter('watched')">✅ Просмотрено</button>
        <button class="filter-btn" onclick="setFilter('dropped')">❌ Заброшено</button>
      </div>
      <button class="btn btn-delete-selected btn-small" onclick="deleteSelected()">🗑 Удалить выбранные</button>
    </div>

    <div class="stats" id="stats"></div>
    <div class="select-all-row" id="selectAllRow" style="display:none;">
      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()">
      <label for="selectAllCheckbox">Выбрать всё</label>
      <span id="selectedCount" style="color:#c07070;"></span>
    </div>
    <div id="list"></div>
  </div>

  <script>
    const STORAGE_KEY = 'seriesTrackerData';
    let currentFilter = 'all';
    let selectedIds = new Set();

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function addItem() {
      const title = document.getElementById('inputTitle').value.trim();
      if (!title) return alert('Введи название!');

      const seasonVal = document.getElementById('inputSeason').value.trim();
      const episodeVal = document.getElementById('inputEpisode').value.trim();

      const item = {
        id: Date.now(),
        title: title,
        rating: parseFloat(document.getElementById('inputRating').value) || 0,
        season: seasonVal === '' ? 1 : (parseInt(seasonVal) || 1),
        episode: episodeVal === '' ? 1 : (parseInt(episodeVal) || 1),
        notes: document.getElementById('inputNotes').value.trim(),
        watched: false,
        dropped: false,
        createdAt: new Date().toISOString()
      };

      const data = loadData();
      data.push(item);
      saveData(data);
      clearForm();
      render();
    }

    function clearForm() {
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputRating').value = '';
      document.getElementById('inputSeason').value = '';
      document.getElementById('inputEpisode').value = '';
      document.getElementById('inputNotes').value = '';
    }

    function toggleWatched(id) {
      const data = loadData();
      const item = data.find(i => i.id === id);
      if (item) {
        item.watched = !item.watched;
        if (item.watched) item.dropped = false;
        saveData(data);
        render();
      }
    }

    function changeEpisode(id, delta) {
      const data = loadData();
      const item = data.find(i => i.id === id);
      if (item) {
        item.episode = Math.max(1, item.episode + delta);
        saveData(data);
        render();
      }
    }

    function changeSeason(id, delta) {
      const data = loadData();
      const item = data.find(i => i.id === id);
      if (item) {
        item.season = Math.max(1, item.season + delta);
        saveData(data);
        render();
      }
    }

    function deleteItem(id) {
      if (!confirm('Удалить навсегда?')) return;
      selectedIds.delete(id);
      const data = loadData().filter(i => i.id !== id);
      saveData(data);
      render();
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateSelectUI();
    }

    function toggleSelectAll() {
      const checked = document.getElementById('selectAllCheckbox').checked;
      const data = getFilteredData();
      if (checked) {
        data.forEach(i => selectedIds.add(i.id));
      } else {
        data.forEach(i => selectedIds.delete(i.id));
      }
      updateSelectUI();
      render();
    }

    function deleteSelected() {
      if (selectedIds.size === 0) return alert('Ничего не выбрано!');
      if (!confirm(`Удалить ${selectedIds.size} выбранных элементов?`)) return;

      const data = loadData().filter(i => !selectedIds.has(i.id));
      selectedIds.clear();
      saveData(data);
      render();
    }

    function updateSelectUI() {
      document.getElementById('selectedCount').textContent =
        selectedIds.size > 0 ? `Выбрано: ${selectedIds.size}` : '';
      document.getElementById('selectAllRow').style.display =
        getFilteredData().length > 0 ? 'flex' : 'none';
    }

    function toggleDropped(id) {
      const data = loadData();
      const item = data.find(i => i.id === id);
      if (item) {
        item.dropped = !item.dropped;
        if (item.dropped) item.watched = false;
        saveData(data);
        render();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      selectedIds.clear();
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.filter-btn[onclick="setFilter('${filter}')"]`)?.classList.add('active');
      render();
    }

    function getFilteredData() {
      const data = loadData();
      switch (currentFilter) {
        case 'watching': return data.filter(i => !i.watched && !i.dropped);
        case 'planned': return data.filter(i => !i.watched && !i.dropped && i.episode === 1 && i.season === 1);
        case 'watched': return data.filter(i => i.watched);
        case 'dropped': return data.filter(i => i.dropped);
        default: return data;
      }
    }

    function render() {
      const data = getFilteredData();
      const container = document.getElementById('list');
      const stats = document.getElementById('stats');
      const allData = loadData();
      stats.textContent = `Всего: ${allData.length} | Смотрим: ${allData.filter(i => !i.watched && !i.dropped).length} | Просмотрено: ${allData.filter(i => i.watched).length} | Заброшено: ${allData.filter(i => i.dropped).length}`;

      updateSelectUI();

      if (data.length === 0) {
        container.innerHTML = '';
        document.getElementById('selectAllRow').style.display = 'none';
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="item ${item.watched ? 'watched' : ''} ${item.dropped ? 'dropped' : ''} ${selectedIds.has(item.id) ? 'selected' : ''}">
          <input type="checkbox" class="item-select" ${selectedIds.has(item.id) ? 'checked' : ''} onchange="toggleSelect(${item.id})" title="Выбрать для удаления">
          <input type="checkbox" class="item-checkbox" ${item.watched ? 'checked' : ''} onchange="toggleWatched(${item.id})" title="Отметить просмотренным">

          <div class="item-title">
            ${item.title}
            ${item.notes ? `<div class="item-notes">${item.notes}</div>` : ''}
          </div>

          <div class="item-info">
            ${item.rating > 0 ? `<span class="item-rating">★ ${item.rating}</span>` : ''}

            <div class="item-season-episode">
              <button class="btn btn-small btn-minus" onclick="changeSeason(${item.id}, -1)" title="Предыдущий сезон">–</button>
              <span>S${item.season}</span>
              <button class="btn btn-small btn-plus" onclick="changeSeason(${item.id}, 1)" title="Следующий сезон">+</button>
            </div>

            <div class="item-season-episode">
              <button class="btn btn-small btn-minus" onclick="changeEpisode(${item.id}, -1)" title="Предыдущая серия">–</button>
              <span>E${item.episode}</span>
              <button class="btn btn-small btn-plus" onclick="changeEpisode(${item.id}, 1)" title="Следующая серия">+</button>
            </div>

            <button class="btn btn-small btn-delete" onclick="deleteItem(${item.id})" title="Удалить">✕</button>
            ${!item.watched ? `<button class="btn btn-small" style="background:#555;color:#ccc;font-size:11px;" onclick="toggleDropped(${item.id})" title="Забросить">${item.dropped ? 'Вернуть' : 'Забросить'}</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    document.getElementById('inputTitle').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addItem();
    });

    render();
  </script>
</body>
</html>
