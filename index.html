<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МЫ ХОДИМ ПОСМОТРЕТЬ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://sun9-42.userapi.com/s/v1/ig2/KDyKALSNSdM5p9tSYaRIze6qvUuDTUZwoKQusS8rSJe4QzQYssY9cnHg60aeaASmjODh2ZcOyNccLUz4cWEB827n.jpg?quality=95&as=32x40,48x60,72x90,108x136,160x201,240x302,358x450&from=bu&u=0vH6ktIUPCGwqZ2ialQHTnMa8UnzmgA0caAmUXU9-QU&cs=358x0') repeat;
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(120, 80, 255, 0.5);
    }

    .add-form {
      background: #c4b06a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid #a8944f;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .form-row input {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #a8944f;
      background: #d5c78e;
      color: #3d3520;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-row input:focus {
      border-color: #8a7a3a;
      background: #e0d39f;
      box-shadow: 0 0 0 3px rgba(138, 122, 58, 0.2);
    }

    .form-row input::placeholder {
      color: #8a7a4a;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-add {
      background: #6a9e6a;
      color: #e0f0e0;
      width: 100%;
    }

    .btn-add:hover {
      background: #558855;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(106, 158, 106, 0.4);
    }

    .btn-small {
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 6px;
      min-width: 30px;
      cursor: pointer;
      border: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-plus {
      background: #4a7a4a;
      color: #e0f0e0;
    }
    .btn-plus:hover {
      background: #3a6a3a;
    }

    .btn-minus {
      background: #4a7a4a;
      color: #e0f0e0;
    }
    .btn-minus:hover {
      background: #3a6a3a;
    }

    .btn-delete {
      background: #d4a0a0;
      color: #5c2d2d;
      border: 1px solid #c47070;
      font-size: 18px;
      padding: 8px 14px;
    }
    .btn-delete:hover {
      background: #c47070;
      color: white;
    }

    .btn-delete-selected {
      background: #7a3030;
      color: #f0d0d0;
      margin-left: auto;
    }
    .btn-delete-selected:hover {
      background: #5a2020;
    }

    .btn-status {
      padding: 7px 16px;
      font-size: 16px;
      border-radius: 20px;
      border: 1px solid #558855;
      background: #6a9e6a;
      color: #e0f0e0;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
      min-width: 44px;
      text-align: center;
    }

    .btn-status.active {
      background: #3a6a3a;
      color: #d0f0d0;
      border-color: #2d5a2d;
    }

    .btn-status:hover {
      background: #558855;
    }

    .btn-status.active:hover {
      background: #2d5a2d;
    }

    .btn-status.dropped-btn.active {
      background: #7a3030;
      color: #f0d0d0;
      border-color: #5a2020;
    }
    .btn-status.dropped-btn.active:hover {
      background: #6a2525;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #4a7a4a;
      color: #c0e0c0;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #b8e6b8;
      border-color: #b8e6b8;
      color: #2d5a2d;
    }

    .item {
      background: #c4b06a;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border: 1px solid #a8944f;
      transition: all 0.2s;
    }

    .item.selected {
      border-color: #ff5252;
      background: #d4a0a0;
    }

    .item.watched {
      background: #b8c4a0;
      border-color: #8a9e6a;
    }

    .item.dropped {
      opacity: 0.5;
    }

    .item:hover {
      background: #d5c78e;
      border-color: #8a7a3a;
    }

    .item-select {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #c07070;
    }

    .item-title {
      font-weight: 700;
      font-size: 16px;
      min-width: 140px;
      flex: 1;
      color: #3d3520;
      background: #fdf6d5;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #a8944f;
    }

    .item-notes {
      font-size: 12px;
      color: #5c4a1f;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 2px 8px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 2px;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .item-rating {
      color: #5c4a1f;
      font-weight: bold;
      font-size: 14px;
    }

    .item-season-episode {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #6a9e6a;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid #558855;
    }

    .item-season-episode span {
      font-weight: bold;
      color: #e0f0e0;
      min-width: 18px;
      text-align: center;
    }

    .status-buttons {
      display: flex;
      gap: 6px;
    }

    .stats {
      text-align: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }

    .select-all-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: #999;
    }

    .select-all-row input {
      accent-color: #c07070;
    }

    @media (max-width: 600px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
      }
      .form-row input {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 МЫ ХОДИМ ПОСМОТРЕТЬ</h1>

    <div class="add-form">
      <div class="form-row">
        <input type="text" id="inputTitle" placeholder="Название фильма или сериала">
        <input type="number" id="inputRating" placeholder="НУ ТИП ОЦЕНКА" min="0" max="10">
      </div>
      <div class="form-row">
        <input type="number" id="inputSeason" placeholder="Сезон" min="1">
        <input type="number" id="inputEpisode" placeholder="Серия" min="1">
        <input type="text" id="inputNotes" placeholder="заметочки">
      </div>
      <button class="btn btn-add" onclick="addItem()">➕ Добавить</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all')">Все</button>
        <button class="filter-btn" onclick="setFilter('watching')">📺 Смотрим</button>
        <button class="filter-btn" onclick="setFilter('planned')">📋 Запланировано</button>
        <button class="filter-btn" onclick="setFilter('watched')">✅ Просмотрено</button>
        <button class="filter-btn" onclick="setFilter('dropped')">⛔️ Заброшено</button>
      </div>
      <button class="btn btn-delete-selected btn-small" onclick="deleteSelected()">🗑 Удалить выбранные</button>
    </div>

    <div class="stats" id="stats"></div>
    <div class="select-all-row" id="selectAllRow" style="display:none;">
      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()">
      <label for="selectAllCheckbox">Выбрать всё</label>
      <span id="selectedCount" style="color:#c07070;"></span>
    </div>
    <div id="list"></div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue, set, push, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDVLLidQuHLIWQhp0PNNFWcWGMM1TRBb6U",
      authDomain: "tipseriki.firebaseapp.com",
      projectId: "tipseriki",
      storageBucket: "tipseriki.firebasestorage.app",
      messagingSenderId: "268844061681",
      appId: "1:268844061681:web:9d7fb866f2529ba515ea50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'series');

    let allData = [];
    let currentFilter = 'all';
    let selectedIds = new Set();

    // Слушаем изменения в базе
    onValue(dbRef, (snapshot) => {
      const val = snapshot.val();
      allData = val ? Object.entries(val).map(([key, value]) => ({ ...value, id: key })) : [];
      render();
    });

    function addItem() {
      const title = document.getElementById('inputTitle').value.trim();
      if (!title) return alert('Введи название!');

      const seasonVal = document.getElementById('inputSeason').value.trim();
      const episodeVal = document.getElementById('inputEpisode').value.trim();

      const newRef = push(dbRef);
      set(newRef, {
        title: title,
        rating: parseFloat(document.getElementById('inputRating').value) || 0,
        season: seasonVal === '' ? 1 : (parseInt(seasonVal) || 1),
        episode: episodeVal === '' ? 1 : (parseInt(episodeVal) || 1),
        notes: document.getElementById('inputNotes').value.trim(),
        status: 'watching',
        createdAt: new Date().toISOString()
      });

      clearForm();
    }

    function clearForm() {
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputRating').value = '';
      document.getElementById('inputSeason').value = '';
      document.getElementById('inputEpisode').value = '';
      document.getElementById('inputNotes').value = '';
    }

    function setStatus(id, status) {
      set(ref(db, 'series/' + id + '/status'), status);
    }

    function changeEpisode(id, delta) {
      const item = allData.find(i => i.id === id);
      if (item) {
        set(ref(db, 'series/' + id + '/episode'), Math.max(1, item.episode + delta));
      }
    }

    function changeSeason(id, delta) {
      const item = allData.find(i => i.id === id);
      if (item) {
        set(ref(db, 'series/' + id + '/season'), Math.max(1, item.season + delta));
      }
    }

    window.addItem = addItem;
    window.setStatus = setStatus;
    window.changeEpisode = changeEpisode;
    window.changeSeason = changeSeason;

    function deleteItem(id) {
      if (!confirm('Удалить навсегда?')) return;
      selectedIds.delete(id);
      remove(ref(db, 'series/' + id));
    }
    window.deleteItem = deleteItem;

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateSelectUI();
    }
    window.toggleSelect = toggleSelect;

    function toggleSelectAll() {
      const checked = document.getElementById('selectAllCheckbox').checked;
      const data = getFilteredData();
      if (checked) {
        data.forEach(i => selectedIds.add(i.id));
      } else {
        data.forEach(i => selectedIds.delete(i.id));
      }
      updateSelectUI();
      render();
    }
    window.toggleSelectAll = toggleSelectAll;

    function deleteSelected() {
      if (selectedIds.size === 0) return alert('Ничего не выбрано!');
      if (!confirm(`Удалить ${selectedIds.size} выбранных элементов?`)) return;
      selectedIds.forEach(id => remove(ref(db, 'series/' + id)));
      selectedIds.clear();
    }
    window.deleteSelected = deleteSelected;

    function updateSelectUI() {
      document.getElementById('selectedCount').textContent =
        selectedIds.size > 0 ? `Выбрано: ${selectedIds.size}` : '';
      document.getElementById('selectAllRow').style.display =
        getFilteredData().length > 0 ? 'flex' : 'none';
    }

    function setFilter(filter) {
      currentFilter = filter;
      selectedIds.clear();
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.filter-btn[onclick="setFilter('${filter}')"]`)?.classList.add('active');
      render();
    }
    window.setFilter = setFilter;

    function getFilteredData() {
      switch (currentFilter) {
        case 'watching': return allData.filter(i => i.status === 'watching');
        case 'planned': return allData.filter(i => i.status === 'planned');
        case 'watched': return allData.filter(i => i.status === 'watched');
        case 'dropped': return allData.filter(i => i.status === 'dropped');
        default: return allData;
      }
    }

    function render() {
      const data = getFilteredData();
      const container = document.getElementById('list');
      const stats = document.getElementById('stats');
      stats.textContent = `Всего: ${allData.length} | Смотрим: ${allData.filter(i => i.status === 'watching').length} | Просмотрено: ${allData.filter(i => i.status === 'watched').length} | Заброшено: ${allData.filter(i => i.status === 'dropped').length}`;

      updateSelectUI();

      if (data.length === 0) {
        container.innerHTML = '';
        document.getElementById('selectAllRow').style.display = 'none';
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="item ${item.status === 'watched' ? 'watched' : ''} ${item.status === 'dropped' ? 'dropped' : ''} ${selectedIds.has(item.id) ? 'selected' : ''}">
          <input type="checkbox" class="item-select" ${selectedIds.has(item.id) ? 'checked' : ''} onchange="toggleSelect('${item.id}')" title="Выбрать для удаления">

          <div class="item-title">
            ${item.title}
            ${item.notes ? `<div class="item-notes">${item.notes}</div>` : ''}
          </div>

          <div class="item-info">
            ${item.rating > 0 ? `<span class="item-rating">★ ${item.rating}</span>` : ''}

            <div class="item-season-episode">
              <button class="btn btn-small btn-minus" onclick="changeSeason('${item.id}', -1)" title="Предыдущий сезон">–</button>
              <span>Сезон ${item.season}</span>
              <button class="btn btn-small btn-plus" onclick="changeSeason('${item.id}', 1)" title="Следующий сезон">+</button>
            </div>

            <div class="item-season-episode">
              <button class="btn btn-small btn-minus" onclick="changeEpisode('${item.id}', -1)" title="Предыдущая серия">–</button>
              <span>Серия ${item.episode}</span>
              <button class="btn btn-small btn-plus" onclick="changeEpisode('${item.id}', 1)" title="Следующая серия">+</button>
            </div>

            <div class="status-buttons">
              <button class="btn-status watching ${item.status === 'watching' ? 'active' : ''}" onclick="setStatus('${item.id}', 'watching')">📺</button>
              <button class="btn-status watched-btn ${item.status === 'watched' ? 'active' : ''}" onclick="setStatus('${item.id}', 'watched')">✅</button>
              <button class="btn-status dropped-btn ${item.status === 'dropped' ? 'active' : ''}" onclick="setStatus('${item.id}', 'dropped')">⛔️</button>
            </div>

            <button class="btn btn-small btn-delete" onclick="deleteItem('${item.id}')" title="Удалить">✕</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('inputTitle').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addItem();
    });
  </script>
</body>
</html>
