<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МЫ ХОТИМ ПОСМОТРЕТЬ ИТД</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://sun9-42.userapi.com/s/v1/ig2/KDyKALSNSdM5p9tSYaRIze6qvUuDTUZwoKQusS8rSJe4QzQYssY9cnHg60aeaASmjODh2ZcOyNccLUz4cWEB827n.jpg?quality=95&as=32x40,48x60,72x90,108x136,160x201,240x302,358x450&from=bu&u=0vH6ktIUPCGwqZ2ialQHTnMa8UnzmgA0caAmUXU9-QU&cs=358x0') repeat;
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(120, 80, 255, 0.5);
    }

    .add-form {
      background: #c4b06a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid #a8944f;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .form-row input {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #a8944f;
      background: #d5c78e;
      color: #3d3520;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-row input:focus {
      border-color: #8a7a3a;
      background: #e0d39f;
      box-shadow: 0 0 0 3px rgba(138, 122, 58, 0.2);
    }

    .form-row input::placeholder {
      color: #8a7a4a;
    }

    .form-row input:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-add {
      background: #4a7a4a;
      color: #c0e0c0;
      width: 100%;
    }

    .btn-add:hover {
      background: #3a6a3a;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(74, 122, 74, 0.4);
    }

    .btn-small {
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 6px;
      min-width: 30px;
      cursor: pointer;
      border: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-plus {
      background: #4a7a4a;
      color: #e0f0e0;
    }
    .btn-plus:hover {
      background: #3a6a3a;
    }

    .btn-minus {
      background: #4a7a4a;
      color: #e0f0e0;
    }
    .btn-minus:hover {
      background: #3a6a3a;
    }

    .btn-delete {
      background: #d4a0a0;
      color: #5c2d2d;
      border: 1px solid #c47070;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 6px;
      min-width: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.4;
    }
    .btn-delete:hover {
      background: #c47070;
      color: white;
    }

    .btn-delete-selected {
      background: #7a3030;
      color: #f0d0d0;
      margin-left: auto;
    }
    .btn-delete-selected:hover {
      background: #5a2020;
    }

    .type-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 10px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #a8944f;
    }

    .type-toggle button {
      flex: 1;
      padding: 8px 16px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      background: #d5c78e;
      color: #8a7a4a;
    }

    .type-toggle button.active {
      background: #4a7a4a;
      color: #c0e0c0;
    }

    .type-toggle button:hover:not(.active) {
      background: #c4b06a;
      color: #5c4a1f;
    }

    .btn-status {
      padding: 7px 16px;
      font-size: 16px;
      border-radius: 20px;
      border: 1px solid #3a6a3a;
      background: #4a7a4a;
      color: #c0e0c0;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
      min-width: 44px;
      text-align: center;
    }

    .btn-status.active {
      background: #2d4a2d;
      color: #d0f0d0;
      border-color: #1d3a1d;
    }

    .btn-status:hover {
      background: #3a6a3a;
    }

    .btn-status.active:hover {
      background: #1d3a1d;
    }

    .btn-status.dropped-btn.active {
      background: #5a2020;
      color: #f0d0d0;
      border-color: #3a1010;
    }
    .btn-status.dropped-btn.active:hover {
      background: #4a1515;
    }

    .btn-status.planned-btn.active {
      background: #4a6078;
      color: #c8d8e8;
      border-color: #3a5068;
    }
    .btn-status.planned-btn.active:hover {
      background: #3a5068;
    }

    .btn-status.watched-btn.active {
      background: #7cba7c;
      color: #e0ffe0;
      border-color: #5a9a5a;
    }
    .btn-status.watched-btn.active:hover {
      background: #6aaa6a;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #3a6a3a;
      background: #4a7a4a;
      color: #c0e0c0;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #2d4a2d;
      border-color: #1d3a1d;
      color: #d0f0d0;
    }

    .sort-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #3a6a3a;
      background: #4a7a4a;
      color: #c0e0c0;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .sort-btn.active {
      background: #2d4a2d;
      color: #d0f0d0;
      border-color: #1d3a1d;
    }

    .sort-btn:hover {
      background: #3a6a3a;
    }

    .search-input {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #3a6a3a;
      background: #4a7a4a;
      color: #c0e0c0;
      font-size: 13px;
      outline: none;
      width: 180px;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #2d4a2d;
      background: #3a6a3a;
      color: #d0f0d0;
      box-shadow: 0 0 0 3px rgba(74, 122, 74, 0.2);
    }

    .search-input::placeholder {
      color: #8a9e8a;
    }

    .list-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .item {
      background: #c4b06a;
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid #a8944f;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .item.selected {
      border-color: #ff5252;
      background: #d4a0a0;
    }

    .item.watched-item {
      opacity: 0.7;
      border-color: #8a9e6a;
    }

    .item:hover {
      background: #d5c78e;
      border-color: #8a7a3a;
    }

    .item-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
    }

    .item-select {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #c07070;
      flex-shrink: 0;
    }

    .item-type-badge {
      font-size: 20px;
      padding: 4px 4px;
      border-radius: 10px;
      background: #4a7a4a;
      color: #c0e0c0;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      flex-shrink: 0;
    }

    .item-title {
      font-weight: 700;
      font-size: 15px;
      color: #3d3520;
      background: #d5c78e;
      padding: 5px 16px;
      border-radius: 20px;
      border: 1px solid #c4b06a;
      text-align: center;
      overflow: visible;
      white-space: normal;
      word-wrap: break-word;
      flex: 1;
      min-width: 80px;
      max-width: 220px;
    }

    .item-title:hover {
      background: #e0d39f;
      border-color: #b8a44a;
    }

    .item-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      padding-top: 8px;
      border-top: 1px solid rgba(168, 148, 79, 0.3);
      align-items: center;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .rating-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #d5c78e;
      padding: 2px 8px 2px 5px;
      border-radius: 10px;
      border: 1px solid #c4b06a;
      height: 30px;
      flex-shrink: 0;
    }

    .rating-group label {
      font-size: 16px;
      line-height: 1;
      margin-right: 2px;
      white-space: nowrap;
    }

    .rating-group input {
      width: 28px;
      background: transparent;
      border: none;
      color: #3d3520;
      font-weight: bold;
      font-size: 13px;
      text-align: center;
      outline: none;
      padding: 2px 0;
    }

    .rating-group.avg {
      background: #6a8a4a;
      border-color: #4a6a3a;
      padding: 2px 10px;
      height: 30px;
    }

    .rating-group.avg span {
      font-weight: bold;
      font-size: 13px;
      min-width: 28px;
      text-align: center;
      color: #e0f0d0;
    }

    .notes-input {
      width: 90px;
      background: #d5c78e;
      border: 1px solid #c4b06a;
      border-radius: 10px;
      padding: 3px 8px;
      color: #3d3520;
      font-size: 12px;
      outline: none;
      transition: all 0.2s;
      height: 30px;
      flex-shrink: 0;
    }

    .notes-input:focus {
      background: #e0d39f;
      border-color: #b8a44a;
    }

    .notes-input::placeholder {
      color: #8a7a4a;
      font-size: 10px;
    }

    .item-season-episode {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #4a7a4a;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
      border: 1px solid #3a6a3a;
      white-space: nowrap;
      height: 30px;
      flex-shrink: 0;
    }

    .item-season-episode span {
      font-weight: bold;
      color: #c0e0c0;
      min-width: 16px;
      text-align: center;
      font-size: 12px;
    }

    .item-season-episode .btn-small {
      padding: 2px 8px;
      font-size: 12px;
      min-width: 22px;
      height: 24px;
    }

    .status-buttons {
      display: flex;
      gap: 4px;
      height: 30px;
      flex-shrink: 0;
    }

    .status-buttons .btn-status {
      padding: 3px 10px;
      font-size: 14px;
      min-width: 32px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls-row .btn-delete {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      padding: 3px 10px;
      min-width: 28px;
    }

    .stats {
      text-align: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }

    .select-all-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: #999;
    }

    .select-all-row input {
      accent-color: #c07070;
    }

    @media (max-width: 750px) {
      .list-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .item {
        padding: 10px 12px;
      }
      .item-title {
        font-size: 14px;
        padding: 4px 12px;
        max-width: none;
      }
      .item-type-badge {
        font-size: 18px;
        min-width: 24px;
      }
      .item-select {
        width: 16px;
        height: 16px;
      }
      .controls-row {
        gap: 4px;
      }
      .rating-group {
        height: 26px;
        padding: 1px 6px;
      }
      .rating-group input {
        width: 24px;
        font-size: 12px;
      }
      .rating-group.avg span {
        font-size: 12px;
        min-width: 24px;
      }
      .notes-input {
        height: 26px;
        width: 70px;
        font-size: 11px;
      }
      .item-season-episode {
        height: 26px;
        font-size: 11px;
        padding: 2px 6px;
      }
      .status-buttons .btn-status {
        height: 26px;
        font-size: 12px;
        min-width: 28px;
        padding: 2px 8px;
      }
      .controls-row .btn-delete {
        height: 26px;
        font-size: 12px;
        padding: 2px 8px;
        min-width: 26px;
      }
      .form-row input {
        min-width: 100%;
      }
      .search-input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 МЫ ХОТИМ ПОСМОТРЕТЬ ИТД</h1>

    <div class="add-form">
      <div class="type-toggle" id="typeToggle">
        <button class="active" onclick="setType('series')" id="btnSeries">📺 Сериал</button>
        <button onclick="setType('movie')" id="btnMovie">🎬 Фильм</button>
      </div>
      <div class="form-row">
        <input type="text" id="inputTitle" placeholder="Название фильма или сериала">
      </div>
      <div class="form-row">
        <input type="number" id="inputMyRating" placeholder="🐲 Оценка радика" min="0" max="10">
        <input type="number" id="inputFriendRating" placeholder="🌸 Оценка рзт" min="0" max="10">
      </div>
      <div class="form-row" id="seasonEpisodeRow">
        <input type="number" id="inputSeason" placeholder="Сезон" min="1">
        <input type="number" id="inputEpisode" placeholder="Серия" min="1">
      </div>
      <div class="form-row">
        <input type="text" id="inputMyNotes" placeholder="📝 Заметки радика">
        <input type="text" id="inputFriendNotes" placeholder="📝 Заметки рзт">
      </div>
      <button class="btn btn-add" onclick="addItem()">➕ Добавить</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all')">Все</button>
        <button class="filter-btn" onclick="setFilter('watching')">👀 Смотрим</button>
        <button class="filter-btn" onclick="setFilter('planned')">📋 Запланировано</button>
        <button class="filter-btn" onclick="setFilter('watched')">🟢 Просмотрено</button>
        <button class="filter-btn" onclick="setFilter('dropped')">⛔️ Заброшено</button>
        <button class="filter-btn" onclick="setFilter('series')">📺 Сериалы</button>
        <button class="filter-btn" onclick="setFilter('movies')">🎬 Фильмы</button>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по названию..." oninput="render()">
      <button class="sort-btn" onclick="setSort('newest')">🕐 Новые</button>
      <button class="sort-btn" onclick="setSort('oldest')">🕐 Старые</button>
      <button class="sort-btn" onclick="setSort('az')">🔤 А-Я</button>
      <button class="sort-btn" onclick="setSort('za')">🔤 Я-А</button>
      <button class="sort-btn" onclick="setSort('rating')">⭐ Общая</button>
      <button class="btn btn-delete-selected btn-small" onclick="deleteSelected()">🗑 Удалить выбранные</button>
    </div>

    <div class="stats" id="stats"></div>
    <div class="select-all-row" id="selectAllRow" style="display:none;">
      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()">
      <label for="selectAllCheckbox">Выбрать всё</label>
      <span id="selectedCount" style="color:#c07070;"></span>
    </div>
    <div class="list-grid" id="list"></div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue, set, push, remove, get, child } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDVLLidQuHLIWQhp0PNNFWcWGMM1TRBb6U",
      authDomain: "tipseriki.firebaseapp.com",
      projectId: "tipseriki",
      storageBucket: "tipseriki.firebasestorage.app",
      messagingSenderId: "268844061681",
      appId: "1:268844061681:web:9d7fb866f2529ba515ea50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'series');

    let allData = [];
    let currentFilter = 'all';
    let currentSort = null;
    let selectedIds = new Set();
    let currentType = 'series';

    onValue(dbRef, (snapshot) => {
      const val = snapshot.val();
      allData = val ? Object.entries(val).map(([key, value]) => ({ ...value, id: key })) : [];
      render();
    });

    function setType(type) {
      currentType = type;
      document.getElementById('btnSeries').classList.toggle('active', type === 'series');
      document.getElementById('btnMovie').classList.toggle('active', type === 'movie');

      const seasonInput = document.getElementById('inputSeason');
      const episodeInput = document.getElementById('inputEpisode');

      if (type === 'movie') {
        seasonInput.disabled = true;
        episodeInput.disabled = true;
        seasonInput.value = '';
        episodeInput.value = '';
        seasonInput.placeholder = '—';
        episodeInput.placeholder = '—';
      } else {
        seasonInput.disabled = false;
        episodeInput.disabled = false;
        seasonInput.placeholder = 'Сезон';
        episodeInput.placeholder = 'Серия';
      }
    }
    window.setType = setType;

    function addItem() {
      const title = document.getElementById('inputTitle').value.trim();
      if (!title) return alert('Введи название!');

      const seasonVal = document.getElementById('inputSeason').value.trim();
      const episodeVal = document.getElementById('inputEpisode').value.trim();

      const myRating = parseFloat(document.getElementById('inputMyRating').value) || 0;
      const friendRating = parseFloat(document.getElementById('inputFriendRating').value) || 0;
      const avgRating = (myRating + friendRating) / 2;

      const newRef = push(dbRef);
      const maxOrder = allData.filter(i => i.status !== 'watched').reduce((max, item) => Math.max(max, item.order || 0), 0);
      set(newRef, {
        title: title,
        type: currentType,
        myRating: myRating,
        friendRating: friendRating,
        avgRating: avgRating,
        season: currentType === 'movie' ? 0 : (seasonVal === '' ? 1 : (parseInt(seasonVal) || 1)),
        episode: currentType === 'movie' ? 0 : (episodeVal === '' ? 1 : (parseInt(episodeVal) || 1)),
        myNotes: document.getElementById('inputMyNotes').value.trim(),
        friendNotes: document.getElementById('inputFriendNotes').value.trim(),
        status: 'watching',
        order: maxOrder + 1,
        createdAt: new Date().toISOString()
      });

      clearForm();
    }

    function clearForm() {
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputMyRating').value = '';
      document.getElementById('inputFriendRating').value = '';
      document.getElementById('inputSeason').value = '';
      document.getElementById('inputEpisode').value = '';
      document.getElementById('inputMyNotes').value = '';
      document.getElementById('inputFriendNotes').value = '';
      if (currentType === 'movie') {
        document.getElementById('inputSeason').disabled = true;
        document.getElementById('inputEpisode').disabled = true;
        document.getElementById('inputSeason').placeholder = '—';
        document.getElementById('inputEpisode').placeholder = '—';
      }
    }

    async function setStatus(id, status) {
      const item = allData.find(i => i.id === id);
      if (!item) return;

      if (status === 'watched') {
        await set(ref(db, 'series/' + id + '/previousOrder'), item.order || 0);
        const maxOrder = allData.reduce((max, i) => Math.max(max, i.order || 0), 0);
        await set(ref(db, 'series/' + id + '/order'), maxOrder + 1);
      } else if (item.status === 'watched') {
        const prevOrder = item.previousOrder || 0;
        await set(ref(db, 'series/' + id + '/order'), prevOrder);
      }

      set(ref(db, 'series/' + id + '/status'), status);
    }

    function updateRating(id, type, value) {
      const val = parseFloat(value) || 0;
      const item = allData.find(i => i.id === id);
      if (!item) return;
      const updates = {};
      updates[type] = val;
      const my = type === 'myRating' ? val : (item.myRating || 0);
      const friend = type === 'friendRating' ? val : (item.friendRating || 0);
      updates.avgRating = (my + friend) / 2;
      set(ref(db, 'series/' + id), { ...item, ...updates });
    }

    function updateNotes(id, type, value) {
      set(ref(db, 'series/' + id + '/' + type), value);
    }

    function changeEpisode(id, delta) {
      const item = allData.find(i => i.id === id);
      if (item && item.type !== 'movie') {
        set(ref(db, 'series/' + id + '/episode'), Math.max(1, item.episode + delta));
      }
    }

    function changeSeason(id, delta) {
      const item = allData.find(i => i.id === id);
      if (item && item.type !== 'movie') {
        set(ref(db, 'series/' + id + '/season'), Math.max(1, item.season + delta));
      }
    }

    window.addItem = addItem;
    window.setStatus = setStatus;
    window.updateRating = updateRating;
    window.updateNotes = updateNotes;
    window.changeEpisode = changeEpisode;
    window.changeSeason = changeSeason;

    function deleteItem(id) {
      if (!confirm('Удалить навсегда?')) return;
      selectedIds.delete(id);
      remove(ref(db, 'series/' + id));
    }
    window.deleteItem = deleteItem;

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateSelectUI();
    }
    window.toggleSelect = toggleSelect;

    function toggleSelectAll() {
      const checked = document.getElementById('selectAllCheckbox').checked;
      const data = getFilteredAndSortedData();
      if (checked) {
        data.forEach(i => selectedIds.add(i.id));
      } else {
        data.forEach(i => selectedIds.delete(i.id));
      }
      updateSelectUI();
      render();
    }
    window.toggleSelectAll = toggleSelectAll;

    function deleteSelected() {
      if (selectedIds.size === 0) return alert('Ничего не выбрано!');
      if (!confirm(`Удалить ${selectedIds.size} выбранных элементов?`)) return;
      selectedIds.forEach(id => remove(ref(db, 'series/' + id)));
      selectedIds.clear();
    }
    window.deleteSelected = deleteSelected;

    function updateSelectUI() {
      document.getElementById('selectedCount').textContent =
        selectedIds.size > 0 ? `Выбрано: ${selectedIds.size}` : '';
      document.getElementById('selectAllRow').style.display =
        getFilteredAndSortedData().length > 0 ? 'flex' : 'none';
    }

    function setFilter(filter) {
      if (currentFilter === filter) {
        currentFilter = 'all';
      } else {
        currentFilter = filter;
      }
      selectedIds.clear();
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.filter-btn[onclick="setFilter('${currentFilter}')"]`)?.classList.add('active');
      render();
    }
    window.setFilter = setFilter;

    function setSort(sort) {
      if (currentSort === sort) {
        currentSort = null;
      } else {
        currentSort = sort;
      }
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      if (currentSort) {
        document.querySelector(`.sort-btn[onclick="setSort('${currentSort}')"]`)?.classList.add('active');
      }
      render();
    }
    window.setSort = setSort;

    function getFilteredData() {
      let data = allData;
      switch (currentFilter) {
        case 'watching': data = allData.filter(i => i.status === 'watching'); break;
        case 'planned': data = allData.filter(i => i.status === 'planned'); break;
        case 'watched': data = allData.filter(i => i.status === 'watched'); break;
        case 'dropped': data = allData.filter(i => i.status === 'dropped'); break;
        case 'series': data = allData.filter(i => i.type === 'series'); break;
        case 'movies': data = allData.filter(i => i.type === 'movie'); break;
      }
      return data;
    }

    function getFilteredAndSortedData() {
      let data = [...getFilteredData()];

      const searchQuery = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
      if (searchQuery) {
        data = data.filter(i => i.title.toLowerCase().includes(searchQuery));
      }

      if (currentSort) {
        switch (currentSort) {
          case 'newest':
            data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            break;
          case 'oldest':
            data.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
            break;
          case 'az':
            data.sort((a, b) => a.title.localeCompare(b.title, 'ru'));
            break;
          case 'za':
            data.sort((a, b) => b.title.localeCompare(a.title, 'ru'));
            break;
          case 'rating':
            data.sort((a, b) => (b.avgRating || 0) - (a.avgRating || 0));
            break;
        }
      } else {
        data.sort((a, b) => {
          if (a.status === 'watched' && b.status !== 'watched') return 1;
          if (a.status !== 'watched' && b.status === 'watched') return -1;
          return (a.order || 0) - (b.order || 0);
        });
      }

      return data;
    }

    function render() {
      const data = getFilteredAndSortedData();
      const container = document.getElementById('list');
      const stats = document.getElementById('stats');
      const searchQuery = document.getElementById('searchInput')?.value.trim() || '';
      stats.textContent = `Всего: ${allData.length} | Смотрим: ${allData.filter(i => i.status === 'watching').length} | Запланировано: ${allData.filter(i => i.status === 'planned').length} | Просмотрено: ${allData.filter(i => i.status === 'watched').length} | Заброшено: ${allData.filter(i => i.status === 'dropped').length}${searchQuery ? ` | Найдено: ${data.length}` : ''}`;

      updateSelectUI();

      if (data.length === 0) {
        container.innerHTML = '';
        document.getElementById('selectAllRow').style.display = 'none';
        return;
      }

      container.innerHTML = data.map(item => {
        const isMovie = item.type === 'movie';
        const isPlanned = item.status === 'planned';
        const isDropped = item.status === 'dropped';
        const isWatched = item.status === 'watched';
        const isWatching = item.status === 'watching';
        const avg = item.avgRating || 0;
        return `
        <div class="item ${isWatched ? 'watched-item' : ''} ${selectedIds.has(item.id) ? 'selected' : ''}">
          <div class="item-top-row">
            <input type="checkbox" class="item-select" ${selectedIds.has(item.id) ? 'checked' : ''} onchange="toggleSelect('${item.id}')" title="Выбрать для удаления">

            <span class="item-type-badge">${isMovie ? '🎬' : '📺'}</span>

            <div class="item-title">
              ${item.title}
            </div>
          </div>

          <div class="item-controls">
            <div class="controls-row">
              <div class="rating-group">
                <label>🐲</label>
                <input type="number" value="${item.myRating || ''}" placeholder="0" min="0" max="10" onchange="updateRating('${item.id}', 'myRating', this.value)" onclick="event.stopPropagation()">
              </div>
              <div class="rating-group">
                <label>🌸</label>
                <input type="number" value="${item.friendRating || ''}" placeholder="0" min="0" max="10" onchange="updateRating('${item.id}', 'friendRating', this.value)" onclick="event.stopPropagation()">
              </div>
              <div class="rating-group avg">
                <span>⭐ ${avg.toFixed(1)}</span>
              </div>

              <input class="notes-input" type="text" value="${item.myNotes || ''}" placeholder="📝 радика" onchange="updateNotes('${item.id}', 'myNotes', this.value)" onclick="event.stopPropagation()">
              <input class="notes-input" type="text" value="${item.friendNotes || ''}" placeholder="📝 рзт" onchange="updateNotes('${item.id}', 'friendNotes', this.value)" onclick="event.stopPropagation()">
            </div>

            <div class="controls-row">
              ${!isMovie ? `
              <div class="item-season-episode">
                <button class="btn btn-small btn-minus" onclick="changeSeason('${item.id}', -1)" title="Предыдущий сезон">–</button>
                <span>Сезон ${item.season || 1}</span>
                <button class="btn btn-small btn-plus" onclick="changeSeason('${item.id}', 1)" title="Следующий сезон">+</button>
              </div>

              <div class="item-season-episode">
                <button class="btn btn-small btn-minus" onclick="changeEpisode('${item.id}', -1)" title="Предыдущая серия">–</button>
                <span>Серия ${item.episode || 1}</span>
                <button class="btn btn-small btn-plus" onclick="changeEpisode('${item.id}', 1)" title="Следующая серия">+</button>
              </div>
              ` : ''}

              <div class="status-buttons">
                <button class="btn-status watching ${isWatching ? 'active' : ''}" onclick="setStatus('${item.id}', 'watching')">👀</button>
                <button class="btn-status planned-btn ${isPlanned ? 'active' : ''}" onclick="setStatus('${item.id}', 'planned')">📋</button>
                <button class="btn-status watched-btn ${isWatched ? 'active' : ''}" onclick="setStatus('${item.id}', 'watched')">🟢</button>
                <button class="btn-status dropped-btn ${isDropped ? 'active' : ''}" onclick="setStatus('${item.id}', 'dropped')">⛔️</button>
              </div>

              <button class="btn-delete" onclick="deleteItem('${item.id}')" title="Удалить">✕</button>
            </div>
          </div>
        </div>
      `}).join('');
    }

    document.getElementById('inputTitle').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addItem();
    });

    window.render = render;
  </script>
</body>
</html>
