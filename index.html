<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МЫ ХОТИМ ПОСМОТРЕТЬ ИТД</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://sun9-42.userapi.com/s/v1/ig2/KDyKALSNSdM5p9tSYaRIze6qvUuDTUZwoKQusS8rSJe4QzQYssY9cnHg60aeaASmjODh2ZcOyNccLUz4cWEB827n.jpg?quality=95&as=32x40,48x60,72x90,108x136,160x201,240x302,358x450&from=bu&u=0vH6ktIUPCGwqZ2ialQHTnMa8UnzmgA0caAmUXU9-QU&cs=358x0') repeat;
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(120, 80, 255, 0.5);
    }

    .add-form {
      background: #c4b06a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid #a8944f;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .form-row input {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #a8944f;
      background: #d5c78e;
      color: #3d3520;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-row input:focus {
      border-color: #8a7a3a;
      background: #e0d39f;
      box-shadow: 0 0 0 3px rgba(138, 122, 58, 0.2);
    }

    .form-row input::placeholder {
      color: #8a7a4a;
    }

    .form-row input:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-add {
      background: #4a7a4a;
      color: #c0e0c0;
      width: 100%;
    }

    .btn-add:hover {
      background: #3a6a3a;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(74, 122, 74, 0.4);
    }

    .btn-small {
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 6px;
      min-width: 30px;
      cursor: pointer;
      border: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-plus {
      background: #4a7a4a;
      color: #e0f0e0;
    }
    .btn-plus:hover {
      background: #3a6a3a;
    }

    .btn-minus {
      background: #4a7a4a;
      color: #e0f0e0;
    }
    .btn-minus:hover {
      background: #3a6a3a;
    }

    .btn-delete {
      background: #d4a0a0;
      color: #5c2d2d;
      border: 1px solid #c47070;
      font-size: 18px;
      padding: 8px 14px;
    }
    .btn-delete:hover {
      background: #c47070;
      color: white;
    }

    .btn-delete-selected {
      background: #7a3030;
      color: #f0d0d0;
      margin-left: auto;
    }
    .btn-delete-selected:hover {
      background: #5a2020;
    }

   
    .type-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 10px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #a8944f;
    }

    .type-toggle button {
      flex: 1;
      padding: 8px 16px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      background: #d5c78e;
      color: #8a7a4a;
    }

    .type-toggle button.active {
      background: #4a7a4a;
      color: #c0e0c0;
    }

    .type-toggle button:hover:not(.active) {
      background: #c4b06a;
      color: #5c4a1f;
    }

    .btn-status {
      padding: 7px 16px;
      font-size: 16px;
      border-radius: 20px;
      border: 1px solid #3a6a3a;
      background: #4a7a4a;
      color: #c0e0c0;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
      min-width: 44px;
      text-align: center;
    }

    .btn-status.active {
      background: #2d4a2d;
      color: #d0f0d0;
      border-color: #1d3a1d;
    }

    .btn-status:hover {
      background: #3a6a3a;
    }

    .btn-status.active:hover {
      background: #1d3a1d;
    }

    .btn-status.dropped-btn.active {
      background: #5a2020;
      color: #f0d0d0;
      border-color: #3a1010;
    }
    .btn-status.dropped-btn.active:hover {
      background: #4a1515;
    }

    .btn-status.planned-btn.active {
      background: #4a6078;
      color: #c8d8e8;
      border-color: #3a5068;
    }
    .btn-status.planned-btn.active:hover {
      background: #3a5068;
    }

    .btn-status.watched-btn.active {
      background: #7cba7c;
      color: #e0ffe0;
      border-color: #5a9a5a;
    }
    .btn-status.watched-btn.active:hover {
      background: #6aaa6a;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #3a6a3a;
      background: #4a7a4a;
      color: #c0e0c0;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #2d4a2d;
      border-color: #1d3a1d;
      color: #d0f0d0;
    }

   
    .sort-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #3a6a3a;
      background: #4a7a4a;
      color: #c0e0c0;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .sort-btn.active {
      background: #2d4a2d;
      color: #d0f0d0;
      border-color: #1d3a1d;
    }

    .sort-btn:hover {
      background: #3a6a3a;
    }

   
    .search-input {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #3a6a3a;
      background: #4a7a4a;
      color: #c0e0c0;
      font-size: 13px;
      outline: none;
      width: 180px;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #2d4a2d;
      background: #3a6a3a;
      color: #d0f0d0;
      box-shadow: 0 0 0 3px rgba(74, 122, 74, 0.2);
    }

    .search-input::placeholder {
      color: #8a9e8a;
    }

    .item {
      background: #c4b06a;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border: 1px solid #a8944f;
      transition: all 0.2s;
    }

    .item.selected {
      border-color: #ff5252;
      background: #d4a0a0;
    }

    .item:hover {
      background: #d5c78e;
      border-color: #8a7a3a;
    }

    .item-select {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #c07070;
    }

    
    .item-type-badge {
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 10px;
      background: #4a7a4a;
      color: #c0e0c0;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      order: -1;
    }

  
    .item-title {
      font-weight: 700;
      font-size: 14px;
      min-width: 80px;
      flex: 1;
      color: #3d3520;
      background: #d5c78e;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #c4b06a;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-title:hover {
      background: #e0d39f;
      border-color: #b8a44a;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }


    .rating-display {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #d5c78e;
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid #c4b06a;
      cursor: pointer;
      font-size: 14px;
      color: #3d3520;
      font-weight: bold;
      min-width: 50px;
      text-align: center;
    }

    .rating-display:hover {
      background: #e0d39f;
    }

    .rating-input {
      width: 40px;
      background: transparent;
      border: none;
      color: #3d3520;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      outline: none;
    }

   
    .notes-input {
      width: 130px;
      background: #d5c78e;
      border: 1px solid #c4b06a;
      border-radius: 10px;
      padding: 6px 12px;
      color: #3d3520;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .notes-input:focus {
      background: #e0d39f;
      border-color: #b8a44a;
    }

    .notes-input::placeholder {
      color: #8a7a4a;
    }

    .item-season-episode {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #4a7a4a;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid #3a6a3a;
    }

    .item-season-episode span {
      font-weight: bold;
      color: #c0e0c0;
      min-width: 18px;
      text-align: center;
    }

    .status-buttons {
      display: flex;
      gap: 6px;
    }

    .stats {
      text-align: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }

    .select-all-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: #999;
    }

    .select-all-row input {
      accent-color: #c07070;
    }

    @media (max-width: 600px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
      }
      .form-row input {
        min-width: 100%;
      }
      .search-input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 МЫ ХОТИМ ПОСМОТРЕТЬ ИТД</h1>

    <div class="add-form">
      <div class="type-toggle" id="typeToggle">
        <button class="active" onclick="setType('series')" id="btnSeries">📺 Сериал</button>
        <button onclick="setType('movie')" id="btnMovie">🎬 Фильм</button>
      </div>
      <div class="form-row">
        <input type="text" id="inputTitle" placeholder="Название фильма или сериала">
        <input type="number" id="inputRating" placeholder="НУ ТИП ОЦЕНКА" min="0" max="10">
      </div>
      <div class="form-row" id="seasonEpisodeRow">
        <input type="number" id="inputSeason" placeholder="Сезон" min="1">
        <input type="number" id="inputEpisode" placeholder="Серия" min="1">
      </div>
      <div class="form-row">
        <input type="text" id="inputNotes" placeholder="заметочки">
      </div>
      <button class="btn btn-add" onclick="addItem()">➕ Добавить</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all')">Все</button>
        <button class="filter-btn" onclick="setFilter('watching')">📺 Смотрим</button>
        <button class="filter-btn" onclick="setFilter('planned')">📋 Запланировано</button>
        <button class="filter-btn" onclick="setFilter('watched')">✅ Просмотрено</button>
        <button class="filter-btn" onclick="setFilter('dropped')">⛔️ Заброшено</button>
        <button class="filter-btn" onclick="setFilter('series')">📺 Сериалы</button>
        <button class="filter-btn" onclick="setFilter('movies')">🎬 Фильмы</button>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по названию..." oninput="render()">
      <button class="sort-btn" onclick="setSort('newest')">🕐 Новые</button>
      <button class="sort-btn" onclick="setSort('oldest')">🕐 Старые</button>
      <button class="sort-btn" onclick="setSort('az')">🔤 А-Я</button>
      <button class="sort-btn" onclick="setSort('za')">🔤 Я-А</button>
      <button class="sort-btn" onclick="setSort('rating')">⭐ Оценка</button>
      <button class="btn btn-delete-selected btn-small" onclick="deleteSelected()">🗑 Удалить выбранные</button>
    </div>

    <div class="stats" id="stats"></div>
    <div class="select-all-row" id="selectAllRow" style="display:none;">
      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()">
      <label for="selectAllCheckbox">Выбрать всё</label>
      <span id="selectedCount" style="color:#c07070;"></span>
    </div>
    <div id="list"></div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue, set, push, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDVLLidQuHLIWQhp0PNNFWcWGMM1TRBb6U",
      authDomain: "tipseriki.firebaseapp.com",
      projectId: "tipseriki",
      storageBucket: "tipseriki.firebasestorage.app",
      messagingSenderId: "268844061681",
      appId: "1:268844061681:web:9d7fb866f2529ba515ea50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'series');

    let allData = [];
    let currentFilter = 'all';
    let currentSort = null;
    let selectedIds = new Set();
    let currentType = 'series';

    onValue(dbRef, (snapshot) => {
      const val = snapshot.val();
      allData = val ? Object.entries(val).map(([key, value]) => ({ ...value, id: key })) : [];
      render();
    });

    function setType(type) {
      currentType = type;
      document.getElementById('btnSeries').classList.toggle('active', type === 'series');
      document.getElementById('btnMovie').classList.toggle('active', type === 'movie');

      const seasonInput = document.getElementById('inputSeason');
      const episodeInput = document.getElementById('inputEpisode');

      if (type === 'movie') {
        seasonInput.disabled = true;
        episodeInput.disabled = true;
        seasonInput.value = '';
        episodeInput.value = '';
        seasonInput.placeholder = '—';
        episodeInput.placeholder = '—';
      } else {
        seasonInput.disabled = false;
        episodeInput.disabled = false;
        seasonInput.placeholder = 'Сезон';
        episodeInput.placeholder = 'Серия';
      }
    }
    window.setType = setType;

    function addItem() {
      const title = document.getElementById('inputTitle').value.trim();
      if (!title) return alert('Введи название!');

      const seasonVal = document.getElementById('inputSeason').value.trim();
      const episodeVal = document.getElementById('inputEpisode').value.trim();

      const newRef = push(dbRef);
      set(newRef, {
        title: title,
        type: currentType,
        rating: parseFloat(document.getElementById('inputRating').value) || 0,
        season: currentType === 'movie' ? 0 : (seasonVal === '' ? 1 : (parseInt(seasonVal) || 1)),
        episode: currentType === 'movie' ? 0 : (episodeVal === '' ? 1 : (parseInt(episodeVal) || 1)),
        notes: document.getElementById('inputNotes').value.trim(),
        status: 'watching',
        createdAt: new Date().toISOString()
      });

      clearForm();
    }

    function clearForm() {
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputRating').value = '';
      document.getElementById('inputSeason').value = '';
      document.getElementById('inputEpisode').value = '';
      document.getElementById('inputNotes').value = '';
      if (currentType === 'movie') {
        document.getElementById('inputSeason').disabled = true;
        document.getElementById('inputEpisode').disabled = true;
        document.getElementById('inputSeason').placeholder = '—';
        document.getElementById('inputEpisode').placeholder = '—';
      }
    }

    function setStatus(id, status) {
      set(ref(db, 'series/' + id + '/status'), status);
    }

    function updateRating(id, rating) {
      set(ref(db, 'series/' + id + '/rating'), parseFloat(rating) || 0);
    }

    function updateNotes(id, notes) {
      set(ref(db, 'series/' + id + '/notes'), notes);
    }

    function changeEpisode(id, delta) {
      const item = allData.find(i => i.id === id);
      if (item && item.type !== 'movie') {
        set(ref(db, 'series/' + id + '/episode'), Math.max(1, item.episode + delta));
      }
    }

    function changeSeason(id, delta) {
      const item = allData.find(i => i.id === id);
      if (item && item.type !== 'movie') {
        set(ref(db, 'series/' + id + '/season'), Math.max(1, item.season + delta));
      }
    }

    window.addItem = addItem;
    window.setStatus = setStatus;
    window.updateRating = updateRating;
    window.updateNotes = updateNotes;
    window.changeEpisode = changeEpisode;
    window.changeSeason = changeSeason;

    function deleteItem(id) {
      if (!confirm('Удалить навсегда?')) return;
      selectedIds.delete(id);
      remove(ref(db, 'series/' + id));
    }
    window.deleteItem = deleteItem;

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateSelectUI();
    }
    window.toggleSelect = toggleSelect;

    function toggleSelectAll() {
      const checked = document.getElementById('selectAllCheckbox').checked;
      const data = getFilteredAndSortedData();
      if (checked) {
        data.forEach(i => selectedIds.add(i.id));
      } else {
        data.forEach(i => selectedIds.delete(i.id));
      }
      updateSelectUI();
      render();
    }
    window.toggleSelectAll = toggleSelectAll;

    function deleteSelected() {
      if (selectedIds.size === 0) return alert('Ничего не выбрано!');
      if (!confirm(`Удалить ${selectedIds.size} выбранных элементов?`)) return;
      selectedIds.forEach(id => remove(ref(db, 'series/' + id)));
      selectedIds.clear();
    }
    window.deleteSelected = deleteSelected;

    function updateSelectUI() {
      document.getElementById('selectedCount').textContent =
        selectedIds.size > 0 ? `Выбрано: ${selectedIds.size}` : '';
      document.getElementById('selectAllRow').style.display =
        getFilteredAndSortedData().length > 0 ? 'flex' : 'none';
    }

    function setFilter(filter) {
      if (currentFilter === filter) {
        currentFilter = 'all';
      } else {
        currentFilter = filter;
      }
      selectedIds.clear();
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.filter-btn[onclick="setFilter('${currentFilter}')"]`)?.classList.add('active');
      render();
    }
    window.setFilter = setFilter;

    function setSort(sort) {
      if (currentSort === sort) {
        currentSort = null;
      } else {
        currentSort = sort;
      }
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      if (currentSort) {
        document.querySelector(`.sort-btn[onclick="setSort('${currentSort}')"]`)?.classList.add('active');
      }
      render();
    }
    window.setSort = setSort;

    function getFilteredData() {
      let data = allData;
      switch (currentFilter) {
        case 'watching': data = allData.filter(i => i.status === 'watching'); break;
        case 'planned': data = allData.filter(i => i.status === 'planned'); break;
        case 'watched': data = allData.filter(i => i.status === 'watched'); break;
        case 'dropped': data = allData.filter(i => i.status === 'dropped'); break;
        case 'series': data = allData.filter(i => i.type === 'series'); break;
        case 'movies': data = allData.filter(i => i.type === 'movie'); break;
      }
      return data;
    }

    function getFilteredAndSortedData() {
      let data = [...getFilteredData()];

      const searchQuery = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
      if (searchQuery) {
        data = data.filter(i => i.title.toLowerCase().includes(searchQuery));
      }

      if (currentSort) {
        switch (currentSort) {
          case 'newest':
            data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            break;
          case 'oldest':
            data.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
            break;
          case 'az':
            data.sort((a, b) => a.title.localeCompare(b.title, 'ru'));
            break;
          case 'za':
            data.sort((a, b) => b.title.localeCompare(a.title, 'ru'));
            break;
          case 'rating':
            data.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            break;
        }
      }

      return data;
    }

    function render() {
      const data = getFilteredAndSortedData();
      const container = document.getElementById('list');
      const stats = document.getElementById('stats');
      const searchQuery = document.getElementById('searchInput')?.value.trim() || '';
      stats.textContent = `Всего: ${allData.length} | Смотрим: ${allData.filter(i => i.status === 'watching').length} | Запланировано: ${allData.filter(i => i.status === 'planned').length} | Просмотрено: ${allData.filter(i => i.status === 'watched').length} | Заброшено: ${allData.filter(i => i.status === 'dropped').length}${searchQuery ? ` | Найдено: ${data.length}` : ''}`;

      updateSelectUI();

      if (data.length === 0) {
        container.innerHTML = '';
        document.getElementById('selectAllRow').style.display = 'none';
        return;
      }

      container.innerHTML = data.map(item => {
        const isMovie = item.type === 'movie';
        const isPlanned = item.status === 'planned';
        const isDropped = item.status === 'dropped';
        const isWatched = item.status === 'watched';
        return `
        <div class="item ${selectedIds.has(item.id) ? 'selected' : ''}">
          <input type="checkbox" class="item-select" ${selectedIds.has(item.id) ? 'checked' : ''} onchange="toggleSelect('${item.id}')" title="Выбрать для удаления">

          <span class="item-type-badge">${isMovie ? '🎬' : '📺'}</span>

          <div class="item-title">
            ${item.title}
          </div>

          <div class="item-info">
            <div class="rating-display" title="Нажми чтобы изменить оценку">
              ★ <input class="rating-input" type="number" value="${item.rating || ''}" placeholder="0" min="0" max="10" onchange="updateRating('${item.id}', this.value)" onclick="event.stopPropagation()">
            </div>

            <input class="notes-input" type="text" value="${item.notes || ''}" placeholder="заметочки" onchange="updateNotes('${item.id}', this.value)" onclick="event.stopPropagation()">

            ${!isMovie ? `
            <div class="item-season-episode">
              <button class="btn btn-small btn-minus" onclick="changeSeason('${item.id}', -1)" title="Предыдущий сезон">–</button>
              <span>Сезон ${item.season || 1}</span>
              <button class="btn btn-small btn-plus" onclick="changeSeason('${item.id}', 1)" title="Следующий сезон">+</button>
            </div>

            <div class="item-season-episode">
              <button class="btn btn-small btn-minus" onclick="changeEpisode('${item.id}', -1)" title="Предыдущая серия">–</button>
              <span>Серия ${item.episode || 1}</span>
              <button class="btn btn-small btn-plus" onclick="changeEpisode('${item.id}', 1)" title="Следующая серия">+</button>
            </div>
            ` : ''}

            <div class="status-buttons">
              <button class="btn-status watching ${item.status === 'watching' ? 'active' : ''}" onclick="setStatus('${item.id}', 'watching')">📺</button>
              <button class="btn-status planned-btn ${isPlanned ? 'active' : ''}" onclick="setStatus('${item.id}', 'planned')">📋</button>
              <button class="btn-status watched-btn ${isWatched ? 'active' : ''}" onclick="setStatus('${item.id}', 'watched')">✅</button>
              <button class="btn-status dropped-btn ${isDropped ? 'active' : ''}" onclick="setStatus('${item.id}', 'dropped')">⛔️</button>
            </div>

            <button class="btn btn-small btn-delete" onclick="deleteItem('${item.id}')" title="Удалить">✕</button>
          </div>
        </div>
      `}).join('');
    }

    document.getElementById('inputTitle').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addItem();
    });

    window.render = render;
  </script>
</body>
</html>
